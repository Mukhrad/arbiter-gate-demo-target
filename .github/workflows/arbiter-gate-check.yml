name: Arbiter Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-and-verify:
    name: route-and-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies (pinned Arbiter Gate release)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Route and verify (real pytest subprocesses, no scripted result)
        run: python scripts/route_and_verify.py --output artifacts

      - name: Publish evidence to the run's own public summary
        if: always()
        run: python scripts/render_summary.py artifacts >> "$GITHUB_STEP_SUMMARY"

      - name: Upload decision audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arbiter-gate-decision-audit
          path: |
            artifacts/decision_audit.jsonl
            artifacts/summary.json
          retention-days: 30

  publish-latest-proof:
    name: publish-latest-proof
    needs: route-and-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies (pinned Arbiter Gate release)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Route and verify again for the committed snapshot
        run: python scripts/route_and_verify.py --output proof/latest

      - name: Commit updated proof snapshot, if it changed
        run: |
          git config user.name "arbiter-gate-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- proof/latest; then
            echo "No change in proof/latest; nothing to commit."
            exit 0
          fi
          git add proof/latest
          git commit \
            -m "Update proof/latest from main @ ${GITHUB_SHA}" \
            -m "Automated, no-human-authorship commit: republishes this same run's own decision_audit.jsonl / summary.json as plain repo files, readable without a GitHub sign-in or opening Actions." \
            -m "Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push
